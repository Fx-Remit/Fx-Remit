[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 200
via_ir = true
# Pinned: CREATE2 gives one forwarder address on every chain only if the bytecode is identical.
solc_version = "0.8.28"

# See more config options https://book.getfoundry.sh/reference/config.html
