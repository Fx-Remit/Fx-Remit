# Standard Claude Code PR review (Anthropic docs: code.claude.com/docs/en/github-actions#run-a-skill)
# Requires CLAUDE_CODE_OAUTH_TOKEN (or switch to anthropic_api_key + ANTHROPIC_API_KEY).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write required so --comment / inline review can post on the PR
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment posts findings on the PR (without it, review only hits the job log)
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Starts the GitHub inline-comment MCP server used by the skill
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
