# Fails (and cancels auto-merge) when Claude's latest review is REQUEST CHANGES.
# Comment-only reviews do not block GitHub auto-merge — this check does.
# After merge: Settings → Branches → require status check "claude-review-gate".
name: Claude review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

jobs:
  claude-review-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Block auto-merge when Claude requested changes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            );

            const isClaude = (login) => {
              const name = (login || '').toLowerCase();
              return name === 'claude[bot]' || name === 'claude';
            };

            const claudeReviews = reviews.filter((r) => isClaude(r.user?.login));
            const latest = claudeReviews.at(-1);
            const state = latest?.state ?? 'NONE';

            core.info(`Latest Claude review state: ${state}`);

            if (state !== 'CHANGES_REQUESTED') {
              core.info('Claude did not request changes — gate passes.');
              return;
            }

            try {
              await github.graphql(
                `mutation($id: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                    pullRequest { number }
                  }
                }`,
                { id: context.payload.pull_request.node_id },
              );
              core.info('Disabled pull request auto-merge.');
            } catch (err) {
              core.warning(`Could not disable auto-merge: ${err.message}`);
            }

            core.setFailed(
              'Claude requested changes. Auto-merge is blocked until Claude (or a human) approves or dismisses that review.',
            );
