# Blocks merge when the latest allowlisted formal Claude CI review is not APPROVE.
# Identity is binding: only claude[bot]/claude, or github-actions[bot] with the
# CI sentinel. A public sentinel alone is never enough.
# - CHANGES_REQUESTED / COMMENTED / incomplete → fail + disable auto-merge
# - APPROVED / DISMISSED / no allowlisted formal review → pass
# After merge: Settings → Branches → require status check "claude-review-gate".
name: Claude review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

jobs:
  claude-review-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Enforce Claude formal review state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const SENTINEL = '<!-- fx-remit-claude-formal-review -->';

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            );

            const isFormalClaudeReview = (r) => {
              const login = (r.user?.login || '').toLowerCase();
              const body = r.body || '';
              const hasSentinel = body.includes(SENTINEL);

              // Claude OAuth identity — actor is authoritative.
              if (login === 'claude[bot]' || login === 'claude') {
                return true;
              }

              // GITHUB_TOKEN submits as github-actions[bot]; require sentinel so
              // unrelated Actions reviews are not treated as Claude formal reviews.
              if (login === 'github-actions[bot]' && hasSentinel) {
                return true;
              }

              return false;
            };

            const claudeReviews = reviews.filter(isFormalClaudeReview);
            const latest = claudeReviews.at(-1);
            const state = (latest?.state || 'NONE').toUpperCase();
            const login = latest?.user?.login || '(none)';

            core.info(`Latest formal Claude review: state=${state} user=${login}`);

            const passStates = new Set(['NONE', 'APPROVED', 'DISMISSED']);
            if (passStates.has(state)) {
              core.info('Gate passes.');
              return;
            }

            try {
              await github.graphql(
                `mutation($id: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                    pullRequest { number }
                  }
                }`,
                { id: context.payload.pull_request.node_id },
              );
              core.info('Disabled pull request auto-merge.');
            } catch (err) {
              core.warning(`Could not disable auto-merge: ${err.message}`);
            }

            if (state === 'CHANGES_REQUESTED') {
              core.setFailed(
                'Claude requested changes. Fix the findings and re-run @claude (or dismiss that review as a human).',
              );
              return;
            }

            core.setFailed(
              `Claude's latest formal review is "${state}" (not APPROVE). Re-run @claude so CI can submit APPROVE or REQUEST_CHANGES.`,
            );
