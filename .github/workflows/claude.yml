name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR: ${{ github.event.issue.pull_request.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          number=""
          if [ "$EVENT_NAME" = "issue_comment" ] && [ -n "$ISSUE_PR" ]; then
            number="$ISSUE_NUMBER"
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ] || [ "$EVENT_NAME" = "pull_request_review" ]; then
            number="$PR_NUMBER"
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha=$(gh api "repos/${REPO}/pulls/${number}" --jq .head.sha)
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      # Snapshot planted verdict from the PR head (not default-branch checkout),
      # and mint a session nonce Claude must echo back (cannot be forged from git).
      # Nonce is injected into the system prompt — do NOT allow unconstrained Read
      # (that would expose /proc/self/environ and job credentials to prompt injection).
      - name: Snapshot PR-head planted verdict and mint session nonce
        id: session
        if: steps.pr.outputs.number != ''
        env:
          VERDICT_FILE: claude-review-verdict.json
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NONCE_FILE: ${{ runner.temp }}/claude-review-nonce.txt
          PLANTED_FILE: ${{ runner.temp }}/planted-verdict.json
        run: |
          set -euo pipefail
          rm -f "$VERDICT_FILE" "${{ runner.temp }}/claude-review-verdict.json" "$PLANTED_FILE"

          # PR-head blob via API — issue_comment checkouts are default branch.
          if gh api "repos/${REPO}/contents/${VERDICT_FILE}?ref=${HEAD_SHA}" --jq .content >/tmp/planted.b64 2>/dev/null; then
            base64 -d </tmp/planted.b64 > "$PLANTED_FILE"
            echo "Planted verdict present on PR head ${HEAD_SHA:0:7} — will reject identical files."
          else
            rm -f "$PLANTED_FILE"
            echo "No planted verdict on PR head ${HEAD_SHA:0:7}."
          fi

          nonce=$(openssl rand -hex 32)
          printf '%s\n' "$nonce" > "$NONCE_FILE"
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # No Read / gh api / gh pr review — nonce is in the prompt; only CI submits formal reviews.
          claude_args: |
            --allowedTools "Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "When reviewing a pull request (including a bare @claude on a PR), you MUST write exactly one JSON file at path claude-review-verdict.json in the repository root before finishing. Schema: {\"verdict\":\"APPROVE\"|\"REQUEST_CHANGES\",\"body\":\"markdown review summary\",\"nonce\":\"${{ steps.session.outputs.nonce }}\"}. The nonce field MUST be exactly the value shown in this schema (this job's session nonce). A planted or stale verdict without this job's nonce is rejected. Use REQUEST_CHANGES for correctness, security, money-path, or other blocking issues. Use APPROVE when there are no blocking issues (nits may go in body). You may post explanatory comments with gh pr comment only. Do NOT run gh pr review or gh api — a CI step submits the formal review from your verdict file. If this is not a PR review request, do not write the verdict file."

      - name: Submit formal PR review from verdict
        id: submit
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_GH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERDICT_FILE: claude-review-verdict.json
          PLANTED_FILE: ${{ runner.temp }}/planted-verdict.json
          NONCE_FILE: ${{ runner.temp }}/claude-review-nonce.txt
          BLOCK_LABEL: claude-changes-requested
          SENTINEL: '<!-- fx-remit-claude-formal-review -->'
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_nonce=$(cat "$NONCE_FILE")

          # Trust only if: valid schema, nonce matches this job, and not the PR-head planted blob.
          trust_verdict=false
          if [ -f "$VERDICT_FILE" ]; then
            if [ -f "$PLANTED_FILE" ] && cmp -s "$VERDICT_FILE" "$PLANTED_FILE"; then
              echo "Rejecting verdict identical to planted PR-head blob."
            else
              if NONCE="$expected_nonce" python3 -c '
          import json,os,sys
          data=json.load(open(sys.argv[1]))
          verdict=(data.get("verdict") or "").strip().upper()
          nonce=(data.get("nonce") or "").strip()
          ok = verdict in ("APPROVE","APPROVED","REQUEST_CHANGES","CHANGES_REQUESTED") and nonce==os.environ["NONCE"]
          sys.exit(0 if ok else 1)
          ' "$VERDICT_FILE"; then
                trust_verdict=true
              else
                echo "Rejecting verdict: invalid schema or nonce mismatch (planted/stale/missing session nonce)."
              fi
            fi
          fi

          ensure_block_label() {
            gh label create "$BLOCK_LABEL" --color B60205 --description "Claude formal review requested changes / CI fail-closed" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "$BLOCK_LABEL"
          }

          clear_block_label() {
            gh pr edit "$PR_NUMBER" --remove-label "$BLOCK_LABEL" 2>/dev/null || true
          }

          disable_automerge() {
            node_id=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .node_id)
            gh api graphql -f query='
              mutation($id:ID!) {
                disablePullRequestAutoMerge(input:{pullRequestId:$id}) {
                  pullRequest { number }
                }
              }' -f id="$node_id" || true
          }

          fail_closed() {
            local msg="$1"
            echo "$msg"
            gh pr comment "$PR_NUMBER" --body "${msg}"$'\n\n'"${SENTINEL}"
            ensure_block_label
            disable_automerge
            exit 1
          }

          if [ "$trust_verdict" != true ]; then
            fail_closed "Claude finished without a trusted session verdict (missing, invalid, nonce mismatch, or identical to a planted PR-head file). Blocking via label \`$BLOCK_LABEL\`."
          fi

          verdict=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"].strip().upper())' "$VERDICT_FILE")
          body=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("body") or "")' "$VERDICT_FILE")
          rm -f "$VERDICT_FILE"

          if [ -z "$body" ]; then
            body="Claude review verdict: $verdict"
          fi

          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$SENTINEL"
          } > /tmp/claude-review-body.md

          create_claude_review() {
            local event="$1"
            GH_TOKEN="$CLAUDE_GH_TOKEN" gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
              -f event="$event" \
              -F "body=@/tmp/claude-review-body.md"
          }

          verify_claude_review_id() {
            local review_id="$1"
            local want="$2"
            GH_TOKEN="$CLAUDE_GH_TOKEN" gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}" \
              | WANT_STATE="$want" python3 -c '
          import json,os,sys
          r=json.load(sys.stdin)
          want=os.environ["WANT_STATE"]
          login=((r.get("user") or {}).get("login") or "").lower()
          body=r.get("body") or ""
          state=(r.get("state") or "").upper()
          ok=(
            login in ("claude[bot]", "claude")
            and "<!-- fx-remit-claude-formal-review -->" in body
            and state==want
          )
          if not ok:
            print("Review %s login=%s state=%s failed verification" % (r.get("id"), login, state), file=sys.stderr)
          sys.exit(0 if ok else 1)
          '
          }

          case "$verdict" in
            APPROVE|APPROVED)
              echo "Submitting APPROVE on PR #$PR_NUMBER via Claude OAuth"
              if ! response=$(create_claude_review APPROVE); then
                fail_closed "Claude OAuth APPROVE failed. Blocking via label \`$BLOCK_LABEL\`."
              fi
              review_id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
              verify_claude_review_id "$review_id" APPROVED
              clear_block_label
              echo "Formal APPROVE id=$review_id verified."
              ;;
            REQUEST_CHANGES|CHANGES_REQUESTED)
              echo "Submitting REQUEST_CHANGES on PR #$PR_NUMBER via Claude OAuth"
              if ! response=$(create_claude_review REQUEST_CHANGES); then
                fail_closed "Claude OAuth REQUEST_CHANGES failed. Blocking via label \`$BLOCK_LABEL\`."
              fi
              review_id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
              verify_claude_review_id "$review_id" CHANGES_REQUESTED
              ensure_block_label
              disable_automerge
              echo "Formal REQUEST_CHANGES id=$review_id verified."
              ;;
            *)
              fail_closed "Invalid verdict '$verdict'. Blocking via label \`$BLOCK_LABEL\`."
              ;;
          esac

      - name: Fail closed when formal review missing
        if: always() && steps.pr.outputs.number != '' && (failure() || cancelled())
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BLOCK_LABEL: claude-changes-requested
          SENTINEL: '<!-- fx-remit-claude-formal-review -->'
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$BLOCK_LABEL" --color B60205 --description "Claude formal review requested changes / CI fail-closed" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "$BLOCK_LABEL" || true
          gh pr comment "$PR_NUMBER" --body "Claude formal-review CI failed or was cancelled. Auto-merge is blocked until the \`$BLOCK_LABEL\` label is cleared by a successful Claude APPROVE or a human."$'\n\n'"$SENTINEL" || true
          node_id=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .node_id)
          gh api graphql -f query='
            mutation($id:ID!) {
              disablePullRequestAutoMerge(input:{pullRequestId:$id}) {
                pullRequest { number }
              }
            }' -f id="$node_id" || true
